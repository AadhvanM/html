<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Gaming Edition</title>
    <link rel="stylesheet" href="web.css"> <!-- External CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- GAMING BACKGROUND -->
    <div class="gaming-bg">
        <div class="rgb-flow"></div>
        <div class="grid-floor"></div>
        <div class="neon-wave">
            <div class="wave-line"></div>
            <div class="wave-line"></div>
            <div class="wave-line"></div>
            <div class="wave-line"></div>
        </div>
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>
    
    <div class="scanlines"></div>

    <!-- NAV -->
    <nav>
        <a href="#">Gmail</a>
        <a href="#">Images</a>
        <i class="fas fa-th icon-box"></i>
        <div class="avatar">U</div>
    </nav>

    <!-- MAIN -->
    <main>
        <div class="logo">
            <span class="g-blue">G</span><span class="g-red">o</span><span class="g-yellow">o</span><span class="g-blue">g</span><span class="g-green">l</span><span class="g-red">e</span>
        </div>

        <div class="search-area">
            <div class="search-box">
                <i class="fas fa-search search-ic"></i>
                <input type="text" placeholder="Search Google...">
                <i class="fas fa-microphone mic"></i>
            </div>
        </div>

        <div class="btn-group">
            <button class="btn-glow">Google Search</button>
            <button class="btn-glow">I'm Feeling Lucky</button>
        </div>
    </main>

    <!-- FOOTER -->
    <footer>
        <div class="ft-link">
            <a href="#">About</a>
            <a href="#">Advertising</a>
            <a href="#">Business</a>
        </div>
        <div class="ft-link">
            <a href="#">Privacy</a>
            <a href="#">Terms</a>
            <a href="#">Settings</a>
        </div>
    </footer>

</body>
</html>
