<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard</title>

<!-- Chart.js CDN -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{
  margin:0;
  padding:0;
  font-family:Arial;
}

body{
  display:flex;
  height:100vh;
}

/* Sidebar */
.sidebar{
  width:20%;
  background:#d60b92;
  color:white;
  padding:20px;
}

.sidebar h2{
  margin-bottom:20px;
}

.sidebar ul{
  list-style:none;
}

.sidebar ul li{
  padding:15px 0;
  cursor:pointer;
}

/* Main */
.main{
  width:80%;
  padding:20px;
  background:#49b908cc;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#ec6810;
  color:white;
  padding:15px;
  border-radius:10px;
}

.cards{
  display:flex;
  gap:20px;
  margin-top:20px;
}

.card{
  flex:1;
  background:white;
  padding:20px;
  border-radius:10px;
  box-shadow:0 5px 15px rgb(231, 235, 6);
  text-align:center;
}

.chart{
  margin-top:30px;
  height:300px;
  background:white;
  border-radius:10px;
  padding:20px;
}
</style>
</head>

<body>

<div class="sidebar">
  <h2>Menu</h2>
  <ul>
    <li><a href="http://127.0.0.1:5500/project2/studentpro.html">Overview</a></li>
    <li><a href="http://127.0.0.1:5501/project2/dashboard.html">Students</a></li>
    <li><a href="http://127.0.0.1:5500/project2/cousre.html">Courses</a></li>
    <li>Reports</li>
    <li>Settings</li>
  </ul>
</div>

<div class="main">

  <div class="top">
    <h2>Dashboard</h2>
    <div>Admin ▼</div>
  </div>

  <div class="cards">
    <div class="card">
      <h3>Students</h3>
      <h1>248</h1>
    </div>

    <div class="card">
      <h3>Courses</h3>
      <h1>12</h1>
    </div>

    <div class="card">
      <h3>Pass Rate</h3>
      <h1>94%</h1>
    </div>
  </div>

  <div class="chart">
    <canvas id="barChart"></canvas>
  </div>

</div>

<script>
// Bar Chart Data
const ctx = document.getElementById('barChart').getContext('2d');
const barChart = new Chart(ctx, {
    type: 'bar',
    data: {
        labels: ['January', 'February', 'March', 'April', 'May', 'June'], // X-axis labels
        datasets: [{
            label: 'New Students',
            data: [30, 45, 28, 60, 50, 75], // Sample data
            backgroundColor: '#1e3d6b'
        }]
    },
    options: {
        responsive: true,
        plugins: {
            legend: {
                display: true,
                position: 'top'
            },
            title: {
                display: true,
                text: 'Monthly Student Enrollment'
            }
        },
        scales: {
            y: {
                beginAtZero: true
            }
        }
    }
});
</script>

</body>
</html>
