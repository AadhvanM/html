<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <center><div>

        <h2><center>contact me</center></h2>

        <form>

           
            <label>Full Name:</label><br>
            <input type="text" placeholder="Enter your name"><br><br>

           
            <label>Email:</label><br>
            <input type="email" placeholder="Enter your email"><br><br>

           
            <label>Phone:</label><br>
            <input type="tel" placeholder="Enter your phone"><br><br>

          
            <label>Password:</label><br>
            <input type="password" placeholder="Enter password"><br><br>

           
            <label>Gender:</label><br>
            <input type="radio" name="gender"> Male
            <input type="radio" name="gender"> Female
            <br><br>

            
            <label>Select Course:</label><br>
            <select>
                <option>HTML</option>
                <option>CSS</option>
                <option>Java</option>
                <option>Python</option>
                <option>JavaScript</option>
            </select><br><br>

            
            <label>Skills:</label><br>
            <input type="checkbox"> do you like 
            <br>
            <input type="checkbox"> you dont like
            <br>
            <input type="checkbox"> both
            <br><br>

           
            <label>Message:</label><br>
            <textarea rows="4" cols="30"
             placeholder="Enter your message"></textarea><br><br>

           
            <button type="submit">Submit</button>
            <button type="reset">Clear</button>

        </form>

    </div>
</center>
</body>
</html>
