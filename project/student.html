<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Portfolio</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial;
}

body{
  height:100vh;
  display:flex;
}

/* Left blue strip */
.left{
  width:25%;
  background:#1f3b64;
}

/* Main content */
.main{
  width:75%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:60px;
}

.text h1{
  font-size:60px;
  font-weight:900;
}

.text p{
  margin-top:20px;
  color:#555;
  line-height:1.5;
}

.btn{
  margin-top:25px;
  padding:12px 25px;
  background:#1f3b64;
  color:white;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.img-box img{
  width:380px;
  border-radius:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
}
</style>
</head>

<body>
<div class="left"></div>

<div class="main">
  <div class="text">
    <h1>STUDENT PORTFOLIO</h1>
    <p>Creative student portfolio webpage design using only HTML and CSS.</p>
    <button class="btn"><a href="http://127.0.0.1:5500/project2/studentpro.html">View Profile</a></button>
  </div>

  <div class="img-box">
    <img src="26454.jpg" alt="profile">
  </div>
</div>

</body>
</html>
