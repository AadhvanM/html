<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Profile</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #74ebd5, #9face6);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .profile-card {
      width: 350px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      text-align: center;
      padding: 20px;
    }

    .profile-card img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #4a90e2;
      margin-top: -60px;
      background: white;
    }

    h2 {
      margin: 10px 0 5px;
    }

    p {
      color: #555;
      margin: 5px 0;
    }

    .info {
      text-align: left;
      margin-top: 15px;
      padding: 10px;
      background: #f5f5f5;
      border-radius: 10px;
    }

    .info span {
      font-weight: bold;
      color: #333;
    }

    .btn {
      margin-top: 15px;
      padding: 10px 15px;
      border: none;
      border-radius: 10px;
      background: #4a90e2;
      color: white;
      cursor: pointer;
    }

    .btn:hover {
      background: #357bd8;
    }
  </style>
</head>

<body>

  <div class="profile-card">

    <!-- Profile Image -->
    <img src="WhatsApp Image 2026-04-22 at 12.25.55 PM.jpeg"  alt="Student Photo">

    <!-- Name -->
    <h2>AADHAVAN M</h2>
    <p>AD Student</p>

    <!-- Details -->
    <div class="info">
      <p><span>Roll No:</span> 21AD045</p>
      <p><span>Department:</span> AD</p>
      <p><span>Year:</span> 2nd Year</p>
      <p><span>Email:</span> aadhavan@gmail.com</p>
      <p><span>College:</span> kongunadu college of Engineering and technogoly College</p>
    </div>

    <button class="btn"><a href="http://127.0.0.1:5500/project2/resume.html">RESUME</a></button>

  </div>

</body>
</html>
