<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Table</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:url(download\ \(2\).jpg) no-repeat center/cover;
  height:100vh;
}

table{
  position:absolute;
  right:40px;
  top:80px;
  border-collapse:collapse;
  width:350px;
  text-align:center;
}

th{
  background:darkblue;
  color:white;
  padding:12px;
}

td{
  padding:12px;
  border:2px solid black;
  font-weight:bold;
}

tr:nth-child(even){
  background:#b7f7b7;
}

tr:nth-child(odd){
  background:#ffbcbc;
}
</style>
</head>

<body>

<table>
  <tr>
    <th>Name</th>
    <th>Department</th>
    <th>Mark</th>
  </tr>

  <tr><td>AADHAV</td><td>CSE</td><td>85</td></tr>
  <tr><td>DENBY</td><td>IT</td><td>90</td></tr>
  <tr><td>KUMARESH</td><td>ECE</td><td>88</td></tr>
  <tr><td>KAV</td><td>MECH</td><td>75</td></tr>
  <tr><td>MINI</td><td>CIVIL</td><td>80</td></tr>
  <tr><td>THI</td><td>EEE</td><td>92</td></tr>

</table>

</body>
</html>
